name: CI

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / format / docs / build / test
    runs-on: ubuntu-latest

    # 这些值仅用于让构建期能完成环境校验，不具备任何真实权限。
    # 真实的 DATABASE_URL / AUTH_SECRET / AI_API_KEY 只存在于本地 .env 与服务器。
    env:
      DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow?schema=public
      AUTH_SECRET: ci-only-placeholder-secret
      AI_BASE_URL: https://api.deepseek.com/v1
      AI_API_KEY: ci-only-placeholder-key
      AI_MODEL: deepseek-chat
      AI_TIMEOUT_MS: "30000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      # 文档质量门禁第 1 条（相对链接必须存在）此前只写在 docs/README.md 里，无人执行；
      # 文档目录重组后根 README 曾残留 9 条失效链接。这里把它变成可执行检查。
      - name: Docs links
        run: npm run docs:check

      - name: Prettier
        run: npx prettier --check .

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # 待办：E2E 用例扩充到覆盖看板拖拽与 AI 确认链路后，追加 `npm run test:e2e` 门禁。
